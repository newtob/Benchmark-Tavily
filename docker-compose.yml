services:
  # OpenTelemetry Collector (optional, for tracing)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: benchmark-otel-collector
    command:
      - "--config=/etc/otel-collector-config.yml"
    volumes:
      - ./scripts/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
      - "8888:8888"  # Prometheus metrics
    environment:
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Main application
  app:
    build: .
    container_name: benchmark-tavily
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=benchmark-tavily
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - benchmark

networks:
  benchmark:
    driver: bridge
