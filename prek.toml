# Pre-commit hooks configuration
## Install with: prek install
### Run all: prek run --all-files

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-json"
exclude = '^(\.vscode/.*\.json|ui/tsconfig\.(app|node)\.json)$'

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"

# Local hooks
[[repos]]
repo = "local"

[[repos.hooks]]
id = "secret-scan"
name = "Secret scan with gitleaks"
entry = "bash ./scripts/hooks/secret-scan.sh"
language = "system"
pass_filenames = false
stages = ["commit"]

[[repos.hooks]]
id = "ruff-check"
name = "Ruff lint"
entry = "python -m ruff check api/"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
entry = "python -m ruff format api/"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "mypy"
name = "MyPy type check"
entry = "python -m mypy api/"
language = "system"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "biome"
name = "Biome lint & format"
entry = "bash ./scripts/hooks/biome-check.sh"
language = "system"
pass_filenames = false
