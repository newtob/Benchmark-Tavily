[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"
# pnpm-lock.yaml uses multi-document YAML that PyYAML's single-doc loader
# rejects; it's generated and validated by pnpm itself, not this hook.
exclude = '^pnpm-lock\.yaml$'

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.7"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v2.3.1"

[[repos.hooks]]
id = "mypy"
files = '^(otel|tests|api|scripts)/.*\.py$'
# The mypy pre-commit hook runs in its own isolated environment (self-
# contained, no repo venv needed) — without these, it can't resolve
# api/'s runtime imports and silently mis-types every FastAPI/pydantic
# class as `Any` instead of raising a real error, which is worse than
# not checking at all. Keep in sync with pyproject.toml's dependencies.
additional_dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "tavily-python==0.8.2",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "tiktoken==0.14.0",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "types-PyYAML==6.0.12.20260906",
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "secret-scan"
name = "Secret scan"
entry = "bash ./scripts/hooks/secret-scan.sh"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "biome-check"
name = "Biome format & lint"
entry = "biome check --write"
language = "node"
additional_dependencies = ["@biomejs/biome@2.5.13"]
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|jsonc)$'
exclude = '^(pnpm-lock\.yaml|.*/dist/.*|.*/build/.*|.*/\.next/.*)$'

[[repos.hooks]]
id = "ts-typecheck"
name = "TypeScript typecheck"
entry = "bash ./scripts/hooks/ts-typecheck.sh"
language = "system"
pass_filenames = false
files = '\.(ts|tsx)$'
