[project]
name = "tavily-benchmark"
version = "0.1.0"
description = "OpenTelemetry tooling for per-prompt Claude Code cost tracking, plus Tavily benchmark tooling."
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "tavily-python==0.8.2",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "tiktoken==0.14.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "prek==0.5.2",
    "respx==0.23.1",
    "types-PyYAML==6.0.12.20260906",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["otel", "."]
testpaths = ["tests"]
