[project]
name = "tavily-benchmark"
version = "0.1.0"
description = "OpenTelemetry tooling for per-prompt Claude Code cost tracking, plus benchmark tooling."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.7", "mypy==2.3.1", "pytest==9.1.1", "prek==0.5.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["otel"]
testpaths = ["tests"]
