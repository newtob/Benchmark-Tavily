name: CI PR

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (prek)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.4.1"

      - name: Install Python dev dependencies
        run: uv sync --group dev

      - name: Run prek (format, lint, typecheck, secret scan)
        run: uv run prek run --all-files --config prek.toml

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.4.1"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python tests
        run: uv run pytest

      - name: Run TypeScript tests
        run: pnpm run test

  e2e:
    name: E2E (Docker + Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.4.1"

      - name: Install e2e dependencies
        run: pnpm --dir e2e install --frozen-lockfile

      - name: Install Playwright's chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Build the app image
        run: docker build -t tavily-benchmark:ci .

      - name: Run the app container
        run: docker run --rm -d --name tavily-benchmark -p 8080:8080 tavily-benchmark:ci

      - name: Wait for the container to become healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/api/healthz && exit 0
            sleep 1
          done
          echo "container did not become healthy in time" >&2
          docker logs tavily-benchmark || true
          exit 1

      - name: Run Playwright
        run: pnpm --dir e2e exec playwright test

      - name: Stop the app container
        if: always()
        run: docker stop tavily-benchmark || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
