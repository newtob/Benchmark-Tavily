name: Fast Commit (Lint, Type, Test)

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: python -m uv sync --extra dev

      - name: Ruff lint check
        run: python -m ruff check api/

      - name: Ruff format check
        run: python -m ruff format --check api/

      - name: MyPy type check
        run: python -m mypy api/

  python-test:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: python -m uv sync --extra dev

      - name: Run pytest
        run: python -m pytest api/tests/ -v --tb=short

  node-lint:
    name: TypeScript Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Biome lint check
        working-directory: ui
        run: pnpm exec biome check .

  node-typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        working-directory: ui
        run: pnpm run type-check

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
        continue-on-error: true
