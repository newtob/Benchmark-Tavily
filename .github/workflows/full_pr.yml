name: Full PR (Docker + Playwright)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: benchmark-tavily:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: benchmark-tavily:test
          cache-from: type=gha

      - name: Start Docker container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name benchmark-app \
            benchmark-tavily:test

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "✓ App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "✗ App did not become healthy"
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ui
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ui
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Stop Docker container
        if: always()
        run: docker stop benchmark-app || true

  all-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [docker-build, playwright]
    if: success()
    steps:
      - run: echo "✅ All PR checks passed"
